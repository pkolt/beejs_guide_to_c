name: Publish Russian guide to GitHub Pages

on:
  push:
    branches:
      - ru
    paths:
      - "ru/src/**"
      - "ru/website/**"
      - "ru/src/Makefile"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out guide
        uses: actions/checkout@v4

      - name: Check out build system
        uses: actions/checkout@v4
        with:
          repository: beejjorgensen/bgbspd
          path: bgbspd

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            fonts-dejavu-core \
            fonts-liberation \
            make \
            pandoc \
            texlive-latex-extra \
            texlive-lang-cyrillic \
            texlive-xetex \
            zip

      - name: Build guide
        run: >-
          make -C ru/src all
          BGBSPD_BUILD_DIR="$GITHUB_WORKSPACE/bgbspd"
          PDF_MAINFONT="Liberation Serif"
          PDF_SANSFONT="Liberation Sans"

      - name: Assemble Pages site
        run: |
          mkdir -p _site/html _site/pdf
          cp -R ru/website/. _site/
          cp -R ru/src/split ru/src/split-wide _site/html/
          cp ru/src/bgc.html _site/html/index.html
          cp ru/src/bgc-wide.html _site/html/index-wide.html
          cp ru/src/bgc_*.pdf _site/pdf/
          (cd ru/src && zip -qr "$GITHUB_WORKSPACE/_site/html/bgc.zip" bgc.html split)
          (cd ru/src && zip -qr "$GITHUB_WORKSPACE/_site/html/bgc-wide.zip" bgc-wide.html split-wide)

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
